# Template only -- do NOT commit a real filled-in version of this.
# `kubectl create secret generic labber-pve-secrets --from-env-file=.env`
# is the easier path once you have a real .env locally.
#
# Only the dashboard login secrets are actually required here -- Proxmox
# connection details and template VMIDs are configured after first boot via
# the in-app Settings page (persisted on the labber-pve-labs PVC), not as
# env vars. You *can* still set PROXMOX_*/TEMPLATE_ID_* here too as a
# bootstrap default if you'd rather pre-seed them (see .env.example), but
# it's optional.
apiVersion: v1
kind: Secret
metadata:
  name: labber-pve-secrets
type: Opaque
stringData:
  DASHBOARD_USERNAME: "admin"
  DASHBOARD_PASSWORD_HASH: ""
  SESSION_SECRET: ""
