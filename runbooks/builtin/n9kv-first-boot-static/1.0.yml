title: Nexus 9000v first boot with a static mgmt0 address (console)
vendor: cisco_n9kv

# DRAFT -- NOT YET VERIFIED ON A REAL CLONE. Follows Cisco's documented NX-OS
# first boot: answer "yes" to "Abort Power On Auto Provisioning" (this skips
# POAP's auto-configuration but still asks for the admin password -- "skip"
# would bypass the password and leave you unable to log in), set the admin
# password, decline the basic configuration dialog, log in, and configure
# mgmt0. Do not press Enter while waiting: Enter at the POAP question picks
# the default, "no", and POAP carries on.

inputs:
  - { id: target, type: target, kind: cisco_n9kv, label: Nexus 9000v node }
  - { id: new_password, type: store, storeType: secret, default: password-complex, label: Admin password }
  - { id: ip, type: string, label: Management IP, placeholder: 192.168.99.70 }
  - { id: prefix, type: number, default: 24, label: Prefix length }
  - { id: gateway, type: string, label: Default gateway, placeholder: 192.168.99.1 }

steps:
  - id: skip-poap
    name: Skip auto provisioning (POAP) and set the admin password
    console:
      - expect: '\(yes/skip/no\)\s*\[no\]:'
        timeout: 1800
        send: 'yes'
      - expect: 'enter the password for .{1,3}admin.{1,3}:'
        timeout: 120
        send: '{{inputs.new_password}}'
      - expect: 'confirm the password for .{1,3}admin.{1,3}:'
        timeout: 30
        send: '{{inputs.new_password}}'
      - expect: 'basic configuration dialog.*\(yes/no\):'
        timeout: 120
        send: 'no'

  - id: login
    name: Log in
    console:
      - expect: 'login:'
        timeout: 600
        send: admin
      - expect: 'password:'
        send: '{{inputs.new_password}}'
      - expect: '#\s*$'
        timeout: 120
      - send: terminal length 0
      - expect: '#\s*$'

  - id: configure
    name: Set the static mgmt0 address and default route
    console:
      - paste: |
          configure terminal
          interface mgmt0
          ip address {{inputs.ip}}/{{inputs.prefix}}
          no shutdown
          vrf context management
          ip route 0.0.0.0/0 {{inputs.gateway}}
          end
        failOn: '% Invalid command|% Incomplete command|% Ambiguous command|% Invalid'
        settle: 3
      - expect: '#\s*$'

  - id: save
    name: Save the configuration
    console:
      - send: copy running-config startup-config
      - expect: 'copy complete'
        timeout: 180
      - expect: '#\s*$'

  - id: update-lab
    name: Save the IP on the node in labber-pve
    lab:
      setMgmtIp: { ip: '{{inputs.ip}}', port: 443 }
