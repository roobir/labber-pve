title: FortiGate first boot -- set the password, read the DHCP management IP (console)
vendor: fortios

# DRAFT -- NOT YET VERIFIED ON A REAL CLONE. Prompts follow Fortinet's
# documented first login (user "admin", blank password, forced to set a new
# one); capture a real run and tighten before locking.
#
# Waits for boot, logs in, answers the forced password change, turns off
# paging, reads the DHCP address of the management interface and saves it on
# the node in labber-pve. For a fixed address use fortigate-first-boot-static.

inputs:
  - { id: target, type: target, kind: fortios, label: FortiGate node }
  - { id: new_password, type: store, storeType: secret, default: password-complex, label: New admin password }
  - { id: interface, type: string, default: port1, label: Management interface }

steps:
  - id: login
    name: Wait for the login prompt and log in
    console:
      - expect: 'login:'
        timeout: 1200
        nudge: 10
        send: admin
      - expect: 'password:'
        send: ''                 # the factory password is blank

  - id: change-password
    name: Answer the forced password change
    console:
      - expect: 'new password:'
        optional: true
        timeout: 60
        send: '{{inputs.new_password}}'
      - expect: 'confirm password:'
        optional: true
        timeout: 20
        send: '{{inputs.new_password}}'
      - expect: '#\s*$'
        timeout: 60

  - id: no-paging
    name: Turn off paging
    console:
      - paste: |
          config system console
          set output standard
          end
        settle: 2
      - expect: '#\s*$'

  - id: detect-ip
    name: Read the management IP
    console:
      - send: get system interface physical
      - expect: '\[{{inputs.interface}}\][^=]*?ip:\s*(?!0\.0\.0\.0)(\d+\.\d+\.\d+\.\d+)'
        as: ip
        timeout: 30
      - expect: '#\s*$'

  - id: update-lab
    name: Save the IP on the node in labber-pve
    lab:
      setMgmtIp: { ip: '{{steps.detect-ip.out.ip}}', port: 443 }
