title: FortiGate first boot with a static management IP (console)
vendor: fortios

# DRAFT -- NOT YET VERIFIED ON A REAL CLONE. Same login as fortigate-first-boot,
# but instead of reading a DHCP address it sets the one you choose on the
# management interface, adds the default route, and saves the IP on the node.

inputs:
  - { id: target, type: target, kind: fortios, label: FortiGate node }
  - { id: new_password, type: store, storeType: secret, default: password-complex, label: New admin password }
  - { id: interface, type: string, default: port1, label: Management interface }
  - { id: ip, type: string, label: Management IP, placeholder: 192.168.99.50 }
  - { id: prefix, type: number, default: 24, label: Prefix length }
  - { id: gateway, type: string, label: Default gateway, placeholder: 192.168.99.1 }

steps:
  - id: login
    name: Wait for the login prompt and log in
    console:
      - expect: 'login:'
        timeout: 1200
        nudge: 10
        send: admin
      - expect: 'password:'
        send: ''

  - id: change-password
    name: Answer the forced password change
    console:
      - expect: 'new password:'
        optional: true
        timeout: 60
        send: '{{inputs.new_password}}'
      - expect: 'confirm password:'
        optional: true
        timeout: 20
        send: '{{inputs.new_password}}'
      - expect: '#\s*$'
        timeout: 60

  - id: configure
    name: Set the static address and default route
    console:
      - paste: |
          config system console
          set output standard
          end
          config system interface
          edit {{inputs.interface}}
          set mode static
          set ip {{inputs.ip}} {{inputs.prefix | netmask}}
          set allowaccess ping https ssh http
          next
          end
          config router static
          edit 1
          set device {{inputs.interface}}
          set gateway {{inputs.gateway}}
          next
          end
        failOn: 'command parse error|Command fail|Unknown action|node_check_object fail|value parse error|Return code -\d+'
      - expect: '#\s*$'

  - id: update-lab
    name: Save the IP on the node in labber-pve
    lab:
      setMgmtIp: { ip: '{{inputs.ip}}', port: 443 }
